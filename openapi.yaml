  /provider/charges/:
    post:
      operationId: provider_charges_create
      description: |-
        Pretend a customer paid by card at the provider's hosted checkout.

        This stands in for an external service, so it doesn't use our JWT auth (anon throttle still applies).
      tags:
      - provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCharge'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - allocate
      - return
      type: string
      description: |-
        * `allocate` - allocate
        * `return` - return
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
        action:
          type: string
          maxLength: 100
        transaction:
          type: integer
          nullable: true
        object_type:
          type: string
          maxLength: 50
        object_id:
          type: string
          maxLength: 50
        data: {}
        request_id:
          type: string
          maxLength: 64
        ip:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
    BankTransferRequest:
      type: object
      properties:
        account_number:
          type: string
          minLength: 1
          maxLength: 17
        amount:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        sender_name:
          type: string
          default: ''
        client_reference:
          type: string
          minLength: 1
      required:
      - account_number
      - amount
      - currency
    CaptureRequest:
      type: object
      properties:
        amount:
          type: integer
          minimum: 1
    ChargeRequest:
      type: object
      properties:
        wallet_id:
          type: integer
        amount:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        client_reference:
          type: string
          minLength: 1
      required:
      - amount
      - currency
      - wallet_id
    CurrencyEnum:
      enum:
      - NGN
      - USD
      - GBP
      type: string
