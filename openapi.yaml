          description: ''
  /api/holds/{id}/capture/:
    post:
      operationId: api_holds_capture_create
      description: Money-moving endpoints get an extra, tighter throttle.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Unique per logical operation. Replays return the original response
          with Idempotent-Replayed: true.'
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
          multipart/form-data:
            schema:
