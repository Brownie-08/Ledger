  /api/kyc/:
    get:
      operationId: api_kyc_retrieve
      description: The caller's own KYC status/limits (GET) and submission or resubmission
        after a rejection (POST).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCProfile'
          description: ''
    post:
      operationId: api_kyc_create
      description: The caller's own KYC status/limits (GET) and submission or resubmission
        after a rejection (POST).
