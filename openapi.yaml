openapi: 3.0.3
info:
  title: Ledger Wallet API
  version: 1.0.0
  description: 'Double-entry payments ledger: wallets, transfers, FX, holds, refunds,
    withdrawals, webhooks. Amounts are integers in minor units. All money-moving POSTs
    require an Idempotency-Key header.'
paths:
  /api/admin/audit-logs/:
    get:
      operationId: api_admin_audit_logs_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/admin/kyc/:
    get:
      operationId: api_admin_kyc_list
      description: Review queue. ``?status=pending`` (default), ``approved``, ``rejected``,
        ``none`` or ``all``.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKYCProfileList'
          description: ''
  /api/admin/kyc/{id}/approve/:
    post:
      operationId: api_admin_kyc_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCProfile'
          description: ''
  /api/admin/kyc/{id}/reject/:
    post:
      operationId: api_admin_kyc_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYCRejectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KYCRejectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KYCRejectRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCProfile'
          description: ''
  /api/admin/reconciliation/:
