  /provider/bank-transfers/:
    post:
      operationId: provider_bank_transfers_create
      description: Pretend someone sent a bank transfer to a virtual account number
        (mock provider, no JWT).
      tags:
      - provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankTransferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankTransferRequest'
          multipart/form-data:
            schema:
