name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -v --cov --cov-report=term --cov-report=xml
      - run: python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-schema
          path: |
            coverage.xml
            openapi.yaml
