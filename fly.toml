# Fly.io config — NOT deployed. To deploy: `fly launch --no-deploy`, attach Postgres + Upstash Redis,
# `fly secrets set SECRET_KEY=... PROVIDER_WEBHOOK_SECRET=...`, then `fly deploy`.
app = "ledger-wallet-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "0"
  ALLOWED_HOSTS = "ledger-wallet-api.fly.dev"
  LOG_FORMAT = "json"
  USE_REDIS_CACHE = "1"
  OTEL_ENABLED = "0"

[deploy]
  release_command = "python manage.py migrate --noinput"

[processes]
  app = "gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 1 --threads 8 --access-logfile -"
  worker = "celery -A config worker -l info"
  beat = "celery -A config beat -l info --schedule /tmp/celerybeat-schedule"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
